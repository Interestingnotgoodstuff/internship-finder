name: Daily internship scan

on:
  schedule:
    - cron: "13 12 * * *"   # every day at 12:13 UTC (about 6:13 a.m. Central)
  workflow_dispatch:         # lets you run it any time from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Self-test
        run: python -m pytest -q

      - name: Scan job boards
        run: python -m finder.main

      - name: Email new postings
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m finder.notify

      - name: Save results
        run: |
          git config user.name "internship-finder-bot"
          git config user.email "internship-finder-bot@users.noreply.github.com"
          git add data docs
          git commit -m "Scan $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
