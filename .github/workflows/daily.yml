name: Daily internship scan

on:
  schedule:
    - cron: "13 12 * * *"   # every day at 12:13 UTC (about 6:13 a.m. Central)
  workflow_dispatch:         # lets you run it any time from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  # Each shard runs on its own GitHub machine (its own IP address), so job
  # boards that rate-limit by address see only a quarter of the traffic.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch shard ${{ matrix.shard }}
        run: python -m finder.main --shard ${{ matrix.shard }} --shards 4
      - uses: actions/upload-artifact@v5
        with:
          name: raw-${{ matrix.shard }}
          path: data/raw/shard_${{ matrix.shard }}.json
          retention-days: 3

  merge:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Self-test
        run: python -m pytest -q
      - uses: actions/download-artifact@v6
        with:
          pattern: raw-*
          path: data/raw
          merge-multiple: true
      - name: Classify and update dashboard
        run: python -m finder.main --merge
      - name: Email new postings
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m finder.notify
      - name: Save results
        run: |
          rm -rf data/raw
          git config user.name "internship-finder-bot"
          git config user.email "internship-finder-bot@users.noreply.github.com"
          git add data docs
          git commit -m "Scan $(date -u +%Y-%m-%d)" || echo "No changes"
          git pull --rebase -X theirs origin main || true
          git push
