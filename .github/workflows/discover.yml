name: Discover job boards

# Run this by hand from the Actions tab. It tests the guesses listed under
# "candidates" in config/companies.yaml and prints a table of the ones that
# work (open the run, then the "Summary" page). Copy hits into "companies".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test guesses
        run: python -m finder.discover
      - name: Save report
        run: |
          git config user.name "internship-finder-bot"
          git config user.email "internship-finder-bot@users.noreply.github.com"
          git add docs/discovery.json
          git commit -m "Discovery report" || echo "No changes"
          git push
