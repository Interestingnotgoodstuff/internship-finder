# Companies the finder checks every day.
#
# How to add a firm:
#   1. Open any job posting on the firm's careers site and look at the URL.
#   2. Match it to one of the patterns below and add an entry.
#
#   Workday:    https://<tenant>.<wd>.myworkdayjobs.com/<site>/job/...
#               -> {name, ats: workday, tenant, wd, site}
#   Greenhouse: https://job-boards.greenhouse.io/<token>/jobs/...
#               -> {name, ats: greenhouse, token}
#   Lever:      https://jobs.lever.co/<slug>/...
#               -> {name, ats: lever, slug}
#   Ashby:      https://jobs.ashbyhq.com/<org>/...
#               -> {name, ats: ashby, org}
#   Phenom:     https://careers.<bank>.com/us/en/job/...   -> {name, ats: phenom, host}
#   Radancy:    https://jobs.<bank>.com/job/<city>/<slug>/<org>/<id>  -> {name, ats: radancy, host}
#   Oracle:     https://<x>.fa.oraclecloud.com/hcmUI/CandidateExperience/en/sites/<site>/job/<id>
#               -> {name, ats: oracle, host, site}
#
# "category" is only a label used for grouping on the dashboard.
# Not sure of the details? Put the firm under "candidates" at the bottom
# and run the "Discover job boards" workflow; it will test guesses for you.

companies:
